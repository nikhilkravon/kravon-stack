<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Loading…</title>
  <meta name="description" id="pageDescription" content="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <!-- Loading skeleton — visible only while data-loading="true" -->
  <div id="catering-shell" aria-hidden="true">
    <div class="cshell-nav">
      <div class="c-skeleton cshell-brand"></div>
    </div>
    <div class="cshell-hero">
      <div class="c-skeleton cshell-h1"></div>
      <div class="c-skeleton cshell-sub"></div>
      <div class="c-skeleton cshell-sub2"></div>
      <div class="c-skeleton cshell-btn"></div>
    </div>
  </div>

  <!-- Error fallback -->
  <div class="catering-error" role="alert">
    <div class="catering-error-icon">⚠️</div>
    <div class="catering-error-title">Page unavailable</div>
    <div class="catering-error-body">We couldn't load your catering page. Please refresh or try again shortly.</div>
  </div>

  <script>
    const _q = new URLSearchParams(window.location.search);
    const KRAVON_API_URL      = "__KRAVON_API_URL__"  !== "__KRAVON_API_URL__"  ? "__KRAVON_API_URL__"  : (_q.get('api')  || 'http://localhost:3000');
    const RESTAURANT_SLUG_ENV = "__RESTAURANT_SLUG__" !== "__RESTAURANT_SLUG__" ? "__RESTAURANT_SLUG__" : _q.get('slug');
  </script>
  <script src="../api-client/kravon-api.js"></script>
  <script src="assets/js/renderer.js"></script>
  <script src="assets/js/behaviour.js"></script>
  <script src="assets/js/boot.js"></script>
  <script src="assets/js/tests.js"></script>
</body>
</html>
